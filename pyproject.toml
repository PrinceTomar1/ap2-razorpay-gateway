[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap2-razorpay-gateway"
version = "0.2.0"
description = "An AP2 v0.2 Merchant + Merchant Payment Processor backed by Razorpay test mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prince Tomar" }]

[tool.setuptools]
packages = ["ap2_min", "gateway", "merchant", "llm", "shopping_agent", "demo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
# Ruff formats Python blocks inside Markdown. Our documentation snippets are
# illustrative — some elide with `...` and are not valid Python — so they are
# prose, not source, and the formatter should leave them alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # comprehensions
    "BLE", # blind except — every one in this repo must be justified in a noqa
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI's Depends(...) in defaults is idiomatic
    "RUF012", # ClassVar annotations not required for our small mutable defaults
    # This project renders money and status for humans: rupee signs, em dashes,
    # check marks, multiplication signs. Every "ambiguous" character below is a
    # deliberate display glyph, never an identifier.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["ap2_min", "gateway", "merchant", "llm", "shopping_agent", "demo"]

[tool.mypy]
python_version = "3.11"
files = ["ap2_min", "gateway", "merchant", "llm", "shopping_agent", "demo", "tests"]
plugins = ["pydantic.mypy"]

# Full strict mode. This is a payments system; an untyped function on the money
# path is a function nobody has checked.
strict = true
warn_unreachable = true
show_error_codes = true

# `razorpay` is the only dependency that ships no type information, so it is the
# only one allowed to be Any. Everything else — pyjwt, fastmcp, anthropic, mcp,
# pydantic — ships py.typed, and PyYAML is covered by types-PyYAML. An earlier
# version of this config had `follow_imports = "skip"` on all of them, which
# silently turned their return values into Any and hid nine real strict errors.
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["razorpay", "razorpay.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --strict-markers"
